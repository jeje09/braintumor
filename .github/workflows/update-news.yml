name: Daily News Auto Update

on:
  schedule:
    # 매일 아침 8시 (KST) 실행 = UTC 기준 전날 오후 11시
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동으로 트리거 가능하도록 추가

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 환경 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: 의존성 설치
        run: npm install

      - name: 뉴스 수집 스크립트 실행
        run: node scripts/fetch-news.js
        
      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/news.json
          git commit -m "Auto-update daily news [skip ci]" || echo "No changes to commit"
          git push
